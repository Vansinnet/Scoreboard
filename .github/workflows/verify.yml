name: Verify portable logic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
          cache: true
          cache-dependency-path: tests/Scoreboard.Tests/packages.lock.json
      - run: dotnet restore tests/Scoreboard.Tests/Scoreboard.Tests.csproj --locked-mode
      - run: dotnet run --project tests/Scoreboard.Tests/Scoreboard.Tests.csproj -c Release --no-restore
      - name: Repository policy
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse -File -Include *.dll,*.zip | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' }) {
            throw 'Committed runtime binaries or archives are forbidden.'
          }
